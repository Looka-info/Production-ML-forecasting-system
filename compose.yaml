services:
  demandcast-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demandcast-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      # Mount trained model releases and current pointer read-only
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./reports:/app/reports:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
